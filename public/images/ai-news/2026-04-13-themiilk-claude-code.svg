<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Glowing Background -->
  <circle cx="900" cy="250" r="450" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="300" cy="600" r="350" fill="url(#glow2)" filter="url(#blur)"/>

  <!-- Decorative Grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1.5" transform="rotate(-5, 600, 400)">
    <path d="M0 -200 V1000"/><path d="M60 -200 V1000"/><path d="M120 -200 V1000"/><path d="M180 -200 V1000"/><path d="M240 -200 V1000"/><path d="M300 -200 V1000"/><path d="M360 -200 V1000"/><path d="M420 -200 V1000"/><path d="M480 -200 V1000"/><path d="M540 -200 V1000"/><path d="M600 -200 V1000"/><path d="M660 -200 V1000"/><path d="M720 -200 V1000"/><path d="M780 -200 V1000"/><path d="M840 -200 V1000"/><path d="M900 -200 V1000"/><path d="M960 -200 V1000"/><path d="M1020 -200 V1000"/><path d="M1080 -200 V1000"/><path d="M1140 -200 V1000"/><path d="M1200 -200 V1000"/><path d="M1260 -200 V1000"/><path d="M1320 -200 V1000"/><path d="M1380 -200 V1000"/>
    <path d="M-200 -200 H1400"/><path d="M-200 -140 H1400"/><path d="M-200 -80 H1400"/><path d="M-200 -20 H1400"/><path d="M-200 40 H1400"/><path d="M-200 100 H1400"/><path d="M-200 160 H1400"/><path d="M-200 220 H1400"/><path d="M-200 280 H1400"/><path d="M-200 340 H1400"/><path d="M-200 400 H1400"/><path d="M-200 460 H1400"/><path d="M-200 520 H1400"/><path d="M-200 580 H1400"/><path d="M-200 640 H1400"/><path d="M-200 700 H1400"/><path d="M-200 760 H1400"/><path d="M-200 820 H1400"/><path d="M-200 880 H1400"/><path d="M-200 940 H1400"/>
  </g>

  <!-- Abstract Art -->
  <g transform="translate(650, 150)">
    
    <circle cx="250" cy="200" r="60" fill="url(#accent)" fill-opacity="0.2" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="250" cy="200" r="30" fill="#ffffff"/>
    <circle cx="100" cy="100" r="25" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="400" cy="120" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
    <circle cx="350" cy="320" r="35" fill="url(#accent)" fill-opacity="0.5"/>
    <circle cx="120" cy="300" r="15" fill="#ffffff"/>
    <path d="M120 115 L210 170 M380 130 L295 175 M330 295 L275 240 M135 290 L210 235" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="6 6"/>
    <ellipse cx="250" cy="200" rx="180" ry="60" fill="none" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="2" transform="rotate(30 250 200)"/>
    <ellipse cx="250" cy="200" rx="180" ry="60" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" transform="rotate(-30 250 200)"/>

  </g>

  <!-- Content Card -->
  <g transform="translate(80, 500)">
    <!-- Glass background with backdrop-filter effect simulation -->
    <rect width="1040" height="240" rx="32" fill="#111115" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="0" y="0" width="1040" height="240" rx="32" fill="url(#accent)" fill-opacity="0.05"/>
    
    <path d="M 60 70 L 80 70" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <text x="100" y="76" fill="url(#accent)" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="3">AGENTIC AI</text>
    
    <text x="60" y="150" fill="url(#text-grad)" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Claude Code as OS</text>
  </g>
</svg>