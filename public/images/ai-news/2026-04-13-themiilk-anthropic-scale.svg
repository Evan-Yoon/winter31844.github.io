<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Glowing Background -->
  <circle cx="900" cy="250" r="450" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="300" cy="600" r="350" fill="url(#glow2)" filter="url(#blur)"/>

  <!-- Decorative Grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1.5" transform="rotate(-5, 600, 400)">
    <path d="M0 -200 V1000"/><path d="M60 -200 V1000"/><path d="M120 -200 V1000"/><path d="M180 -200 V1000"/><path d="M240 -200 V1000"/><path d="M300 -200 V1000"/><path d="M360 -200 V1000"/><path d="M420 -200 V1000"/><path d="M480 -200 V1000"/><path d="M540 -200 V1000"/><path d="M600 -200 V1000"/><path d="M660 -200 V1000"/><path d="M720 -200 V1000"/><path d="M780 -200 V1000"/><path d="M840 -200 V1000"/><path d="M900 -200 V1000"/><path d="M960 -200 V1000"/><path d="M1020 -200 V1000"/><path d="M1080 -200 V1000"/><path d="M1140 -200 V1000"/><path d="M1200 -200 V1000"/><path d="M1260 -200 V1000"/><path d="M1320 -200 V1000"/><path d="M1380 -200 V1000"/>
    <path d="M-200 -200 H1400"/><path d="M-200 -140 H1400"/><path d="M-200 -80 H1400"/><path d="M-200 -20 H1400"/><path d="M-200 40 H1400"/><path d="M-200 100 H1400"/><path d="M-200 160 H1400"/><path d="M-200 220 H1400"/><path d="M-200 280 H1400"/><path d="M-200 340 H1400"/><path d="M-200 400 H1400"/><path d="M-200 460 H1400"/><path d="M-200 520 H1400"/><path d="M-200 580 H1400"/><path d="M-200 640 H1400"/><path d="M-200 700 H1400"/><path d="M-200 760 H1400"/><path d="M-200 820 H1400"/><path d="M-200 880 H1400"/><path d="M-200 940 H1400"/>
  </g>

  <!-- Abstract Art -->
  <g transform="translate(650, 150)">
    
    <path d="M150 150 L250 100 L350 150 L250 200 Z" fill="url(#accent)" fill-opacity="0.2" stroke="url(#accent)" stroke-width="3"/>
    <path d="M150 150 V250 L250 300 V200 Z" fill="url(#accent)" fill-opacity="0.4" stroke="url(#accent)" stroke-width="3"/>
    <path d="M350 150 V250 L250 300 V200 Z" fill="url(#accent)" fill-opacity="0.1" stroke="url(#accent)" stroke-width="3"/>
    
    <path d="M150 220 L250 170 L350 220 L250 270 Z" fill="url(#accent)" fill-opacity="0.2" stroke="url(#accent)" stroke-width="3"/>
    <path d="M150 220 V320 L250 370 V270 Z" fill="url(#accent)" fill-opacity="0.4" stroke="url(#accent)" stroke-width="3"/>
    <path d="M350 220 V320 L250 370 V270 Z" fill="url(#accent)" fill-opacity="0.1" stroke="url(#accent)" stroke-width="3"/>
    
    <path d="M50 250 L250 350 L450 250" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" fill="none"/>
    <circle cx="250" cy="350" r="5" fill="#ffffff"/>
    <circle cx="50" cy="250" r="4" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="450" cy="250" r="4" fill="#ffffff" fill-opacity="0.5"/>

  </g>

  <!-- Content Card -->
  <g transform="translate(80, 500)">
    <!-- Glass background with backdrop-filter effect simulation -->
    <rect width="1040" height="240" rx="32" fill="#111115" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="0" y="0" width="1040" height="240" rx="32" fill="url(#accent)" fill-opacity="0.05"/>
    
    <path d="M 60 70 L 80 70" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <text x="100" y="76" fill="url(#accent)" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="3">COMPUTE SCALE</text>
    
    <text x="60" y="150" fill="url(#text-grad)" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Anthropic 45T Run Rate</text>
  </g>
</svg>