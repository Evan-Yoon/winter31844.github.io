    <rect width="1040" height="238" rx="30" fill="url(#accent)" fill-opacity="0.06"/>
    <path d="M60 70 H88" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <text x="108" y="78" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="24">MICROSOFT SECURITY</text>
    <text x="60" y="152" fill="url(#textGrad)" font-family="Inter, system-ui, sans-serif" font-weight="850" font-size="52">AI-Powered Defense</text>
    <text x="62" y="204" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28">for an AI-accelerated threat landscape</text>
