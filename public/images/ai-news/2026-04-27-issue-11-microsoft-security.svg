    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="920" cy="230" r="430" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="270" cy="640" r="360" fill="url(#glow2)" filter="url(#blur)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5">
    <path d="M0 120 H1200"/><path d="M0 220 H1200"/><path d="M0 320 H1200"/><path d="M0 420 H1200"/><path d="M0 520 H1200"/><path d="M0 620 H1200"/>
    <path d="M160 0 V800"/><path d="M320 0 V800"/><path d="M480 0 V800"/><path d="M640 0 V800"/><path d="M800 0 V800"/><path d="M960 0 V800"/>
  </g>

  <g transform="translate(670 125)" filter="url(#softShadow)">
    <path d="M230 20 L410 90 V255 C410 390 340 476 230 540 C120 476 50 390 50 255 V90 Z" fill="#0f172a" stroke="url(#accent)" stroke-width="8"/>
    <path d="M230 72 L355 122 V258 C355 355 307 419 230 468 C153 419 105 355 105 258 V122 Z" fill="url(#accent)" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M168 270 L214 316 L303 202" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="112" r="9" fill="#38bdf8"/>
    <circle cx="358" cy="112" r="9" fill="#22c55e"/>
    <circle cx="230" cy="468" r="9" fill="#ffffff"/>
