<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">GRU math flow diagram</title>
  <desc id="desc">Simple diagram showing reset gate, candidate hidden state, update gate, and final hidden state in GRU.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>

  <rect x="60" y="110" width="180" height="90" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="150" y="162" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" fill="#1e3a8a">x_t</text>

  <rect x="60" y="280" width="180" height="90" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="150" y="332" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" fill="#4c1d95">h_(t-1)</text>

  <rect x="320" y="95" width="180" height="90" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="410" y="134" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7f1d1d">Reset gate</text>
  <text x="410" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7f1d1d">r_t</text>

  <rect x="320" y="245" width="220" height="120" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="430" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0c4a6e">
    <tspan x="430" dy="0">후보</tspan>
    <tspan x="430" dy="22">hidden state</tspan>
  </text>
  <text x="430" y="330" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#0c4a6e">h~_t</text>

  <rect x="635" y="95" width="180" height="90" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="725" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#14532d">Update gate</text>
  <text x="725" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#14532d">z_t</text>

  <rect x="635" y="235" width="250" height="185" rx="28" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <text x="760" y="286" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">최종 혼합</text>
  <text x="760" y="330" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#334155">(1 - z_t) * h_(t-1)</text>
  <text x="760" y="363" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#334155">+</text>
  <text x="760" y="396" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#334155">z_t * h~_t</text>

  <rect x="965" y="245" width="180" height="120" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1055" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#92400e">
    <tspan x="1055" dy="0">새</tspan>
    <tspan x="1055" dy="22">hidden state</tspan>
  </text>
  <text x="1055" y="328" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#92400e">h_t</text>

  <path d="M240 155 C280 155, 285 140, 320 140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M240 325 C280 325, 285 155, 320 155" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M240 325 C285 325, 290 300, 320 300" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M240 155 C285 155, 295 330, 320 330" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M500 140 C560 140, 575 140, 635 140" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M540 305 C590 305, 605 355, 635 355" fill="none" stroke="#0284c7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M240 325 C430 325, 510 325, 635 325" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M815 140 C860 140, 865 300, 885 300" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M885 320 C925 320, 930 300, 965 300" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="600" y="500" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">
    GRU는 후보 hidden state를 만든 뒤, Update gate로 과거와 새 정보를 얼마나 섞을지 정한다.
  </text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
