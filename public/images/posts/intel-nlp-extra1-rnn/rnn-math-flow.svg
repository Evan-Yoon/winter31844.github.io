<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RNN math flow diagram</title>
  <desc id="desc">Simple diagram showing how current input and previous hidden state combine to produce current hidden state and prediction.</desc>
  <rect width="1200" height="560" fill="#f7f8fc"/>

  <rect x="60" y="110" width="220" height="110" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="170" y="152" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1e3a8a">현재 입력</text>
  <text x="170" y="192" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#1e3a8a">x_t</text>

  <rect x="60" y="330" width="220" height="110" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="170" y="366" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#4c1d95">
    <tspan x="170" dy="0">이전</tspan>
    <tspan x="170" dy="26">hidden state</tspan>
  </text>
  <text x="170" y="424" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#4c1d95">h_(t-1)</text>

  <rect x="395" y="145" width="350" height="275" rx="30" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <text x="570" y="196" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">
    <tspan x="570" dy="0">현재 입력과</tspan>
    <tspan x="570" dy="28">이전 state 결합</tspan>
  </text>
  <text x="570" y="270" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#334155">W_xh * x_t</text>
  <text x="570" y="310" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#334155">+</text>
  <text x="570" y="350" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#334155">W_hh * h_(t-1) + b</text>
  <text x="570" y="400" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#0f172a">tanh로 값 정리</text>

  <rect x="860" y="110" width="250" height="110" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="985" y="146" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#14532d">
    <tspan x="985" dy="0">새</tspan>
    <tspan x="985" dy="26">hidden state</tspan>
  </text>
  <text x="985" y="204" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#14532d">h_t</text>

  <rect x="860" y="330" width="250" height="110" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="985" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7f1d1d">예측 출력</text>
  <text x="985" y="412" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#7f1d1d">y_t</text>

  <path d="M280 165 C330 165, 345 210, 395 210" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M280 385 C330 385, 345 350, 395 350" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M745 220 C790 220, 805 180, 860 180" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M745 340 C795 340, 805 385, 860 385" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="600" y="510" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">
    RNN은 현재 입력과 이전 hidden state를 합쳐서 지금 시점의 hidden state를 만든다.
  </text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
