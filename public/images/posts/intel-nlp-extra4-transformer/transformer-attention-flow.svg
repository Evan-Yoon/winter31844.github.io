<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer attention flow diagram</title>
  <desc id="desc">Simple diagram showing how input tokens become Q, K, V, then attention scores, weights, and contextual output.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>

  <rect x="60" y="100" width="240" height="360" rx="28" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <text x="180" y="145" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">입력 토큰</text>
  <rect x="95" y="180" width="170" height="55" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="216" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#1e3a8a">The</text>
  <rect x="95" y="250" width="170" height="55" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="286" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#14532d">cat</text>
  <rect x="95" y="320" width="170" height="55" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="356" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#7f1d1d">sat</text>
  <rect x="95" y="390" width="170" height="55" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="180" y="426" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#92400e">...</text>

  <rect x="395" y="110" width="140" height="90" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="465" y="148" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#1e3a8a">Q</text>
  <text x="465" y="180" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">무엇을 찾나</text>

  <rect x="395" y="235" width="140" height="90" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="465" y="273" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#14532d">K</text>
  <text x="465" y="305" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#14532d">비교 기준</text>

  <rect x="395" y="360" width="140" height="90" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="465" y="398" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#7f1d1d">V</text>
  <text x="465" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#7f1d1d">가져올 정보</text>

  <rect x="650" y="170" width="210" height="150" rx="26" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <text x="755" y="212" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">토큰 점수 계산</text>
  <text x="755" y="255" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#334155">QK^T / sqrt(d_k)</text>
  <text x="755" y="296" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">비교 후 크기 조정</text>

  <rect x="650" y="365" width="210" height="120" rx="26" fill="#faf5ff" stroke="#a21caf" stroke-width="3"/>
  <text x="755" y="408" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#86198f">Softmax</text>
  <text x="755" y="445" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#86198f">점수를 비율로 바꿈</text>

  <rect x="950" y="195" width="180" height="120" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1040" y="238" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#92400e">가중합된 V</text>
  <text x="1040" y="276" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#92400e">문맥 반영 출력</text>

  <rect x="950" y="365" width="180" height="120" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="1040" y="408" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0c4a6e">새 토큰 표현</text>
  <text x="1040" y="446" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#0c4a6e">문맥이 반영된 상태</text>

  <path d="M300 280 C340 280, 350 155, 395 155" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 280 C340 280, 350 280, 395 280" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 280 C340 280, 350 405, 395 405" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M535 155 C590 155, 595 220, 650 220" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M535 280 C590 280, 595 270, 650 270" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M535 405 C600 405, 605 450, 650 450" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 245 C905 245, 910 255, 950 255" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 425 C905 425, 910 425, 950 425" fill="none" stroke="#a21caf" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1040 315 C1040 330, 1040 345, 1040 365" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="600" y="560" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#475569">
    Attention은 Q, K, V로 점수를 만들고, 그 점수를 비율로 바꿔 문맥 정보를 다시 모은다.
  </text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
